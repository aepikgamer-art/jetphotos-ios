name: JetPhotos

options:
  bundleIdPrefix: dev.jetphotos
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.06"
    CURRENT_PROJECT_VERSION: "6"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  JetPhotos:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: JetPhotos
        CFBundleShortVersionString: "2.06"
        CFBundleVersion: "6"
        UILaunchScreen:
          UIColorName: ""
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: "JetPhotos saves downloaded photos to your photo library."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  JetPhotos:
    build:
      targets:
        JetPhotos: all
    archive:
      config: Release
