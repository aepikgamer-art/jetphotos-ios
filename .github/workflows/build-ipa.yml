name: Build IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26+
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project JetGlass.xcodeproj \
            -scheme JetGlass \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/JetGlass.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcpretty

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/JetGlass.xcarchive/Products/Applications/JetGlass.app" build/Payload/
          cd build
          zip -qry JetGlass.ipa Payload
          ls -lh JetGlass.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JetPhotos-iOS-ipa
          path: build/JetGlass.ipa
          retention-days: 30

      - name: Create GitHub Release with the IPA
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/JetGlass.ipa \
            --title "JetPhotos iOS ${GITHUB_REF_NAME}" \
            --notes "Unsigned IPA built with Xcode 26.6.\n\nDownload JetGlass.ipa from this release.\n\nAltDirect source: https://raw.githubusercontent.com/aepikgamer-art/jetphotos-ios/main/altstore-source.json\n\nSource: https://github.com/aepikgamer-art/jetphotos-ios" \
            || gh release upload "${GITHUB_REF_NAME}" build/JetGlass.ipa --clobber

      - name: Upload xcarchive logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
